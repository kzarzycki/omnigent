# yaml-language-server: $schema=https://docs.mergify.com/mergify-configuration-schema.json
#
# GENERATED by .claude/skills/cloud-dev/render-mergify.py from the gatekeeper pack's mergify.yml (read its header for
# what each key does); edit that script, never this file, and rerun it after the pack moves. This fork's changes to
# the template: base `mine`; the queue-only variant, so `merge_conditions` is `check-success = gate` (`gate` runs on
# Mergify's draft PRs alone, `.github/workflows/gate.yml`); `batch_size` 5; `checks_timeout` above `gate`'s
# 240-minute job timeout; the `default` queue leaves `sync/*` heads to the `sync` queue, which merges them with a
# merge commit so `mine` keeps upstream's parent (`land.merge_commit_heads`, docs/agents/gatekeeper.md); and
# `commands_restrictions` limits `@mergifyio queue` to write access.

queue_rules:
  - name: default
    merge_method: squash
    batch_size: 5
    batch_max_wait_time: 5 minutes
    # the branch every batch's draft PR is pushed from, the prefix the CI's test step matches: named here, not left to
    # the default, so the two can't drift apart
    queue_branch_prefix: mergify/merge-queue/
    # one retry of a red batch, so a dequeue is the second red. A retry also disables in-place checks, but that is not
    # what keeps a batch off the PR's own branch: an up-to-date first PR merges with no draft PR whatever this is set
    # to, so `merge_conditions` below is what forces the draft PR
    max_checks_retries: 1
    # a red batch is split, each part tested on top of the ones before it, until the failing PR is found, however
    # many rounds that takes; only it leaves the queue. A number would dequeue a part still holding several PRs once
    # it ran out
    batch_max_failure_resolution_attempts: null
    # a batch whose checks never report leaves the queue instead of holding it
    checks_timeout: 4 hours 15 minutes
    queue_conditions:
      - base = mine
      - -draft
      - -head ~= ^sync/
      - label = loop:queued
      - -label = loop:hold
      - check-success = land
    # two-step CI, so the queue never checks a PR in place (Never in place, above): different from `queue_conditions`
    merge_conditions:
      - check-success = gate

  # An upstream-sync PR keeps upstream's parent (docs/agents/gatekeeper.md).
  - name: sync
    merge_method: merge
    batch_size: 1
    max_checks_retries: 1
    checks_timeout: 4 hours 15 minutes
    queue_conditions:
      - base = mine
      - -draft
      - head ~= ^sync/
      - label = loop:queued
      - -label = loop:hold
      - check-success = land
    merge_conditions:
      - check-success = gate

pull_request_rules:
  - name: queue what land handed over
    conditions:
      - base = mine
      - -draft
      - -head ~= ^sync/
      - label = loop:queued
      - -label = loop:hold
      - check-success = land
    actions:
      queue:
        name: default

  - name: queue a handed-over upstream sync
    conditions:
      - base = mine
      - -draft
      - head ~= ^sync/
      - label = loop:queued
      - -label = loop:hold
      - check-success = land
    actions:
      queue:
        name: sync

merge_queue:
  dequeued_label: loop:dequeued

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
