# Mergify only executes: approval policy stays in the engineering loop's
# `approvals.py check merge`. A PR queues itself once the gate job is green and the
# land tool has posted the `land` commit status on this head (after `check merge`
# passes; a push drops it, and fork PR tokens can't post it).
pull_request_rules:
  - name: queue a PR the land tool approved
    conditions:
      - base=mine
      - check-success=gate
      - status-success=land
    actions:
      queue:

commands_restrictions:
  queue:
    conditions:
      - sender-permission>=write

queue_rules:
  - name: default
    queue_conditions:
      - base=mine
      - status-success=land
      - -head~=^sync/
    merge_conditions:
      - check-success=gate
    merge_method: squash
    batch_size: 1
  # An upstream-sync PR keeps upstream's parent (docs/agents/gatekeeper.md).
  - name: sync
    queue_conditions:
      - base=mine
      - status-success=land
      - head~=^sync/
    merge_conditions:
      - check-success=gate
    merge_method: merge
    batch_size: 1
