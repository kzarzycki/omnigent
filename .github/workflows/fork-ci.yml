name: Fork CI

# Fork only (kzarzycki/omnigent). Runs the tests a change touches, chosen from the
# diff by .claude/skills/cloud-dev/affected_tests.py, on every PR and push to mine.
# Upstream's ci.yml stays disabled in this fork's Actions settings; the full suite
# runs nightly in fork-nightly.yml.

on:
  pull_request:
    branches: [mine]
  push:
    branches: [mine]

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  affected-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra all --group test

      - name: Run affected tests
        env:
          # PR: the base branch tip. Push: the commit before the push (all zeros on a new branch
          # selects the whole suite, as no base does).
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .claude/skills/cloud-dev/run-affected-tests.sh
