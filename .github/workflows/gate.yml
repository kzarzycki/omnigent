name: Gate

# Fork only. The merge gate Mergify's queue requires (.mergify.yml): the checks
# `mise run check:all` and the full unit suite run, on the PR and on Mergify's
# temporary merge-queue branches.

on:
  pull_request:
    branches: [mine]
  push:
    branches: ["mergify/merge-queue/**"]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install mise
        env:
          MISE_VERSION: v2026.11.10
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # check:setup builds the venv; its tools (pre-commit) run bare in the tasks.
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # check:all is the task `land` ran (mise.toml); it sets up Python and the web packages first.
      - name: Run the checks
        env:
          MISE_YES: "1"
          OMNIGENT_SKIP_WEB_UI: "true"
          # fork-sync/test.sh asks `gh` for the repo; the runner's gh has no login.
          GH_TOKEN: ${{ github.token }}
          # The skills' tests commit in scratch repos and need an identity.
          GIT_AUTHOR_NAME: gate
          GIT_AUTHOR_EMAIL: gate@example.invalid
          GIT_COMMITTER_NAME: gate
          GIT_COMMITTER_EMAIL: gate@example.invalid
        run: |
          mise run check:all

      - name: Run the full unit suite
        env:
          OMNIGENT_SKIP_WEB_UI: "true"
        run: uv run --no-sync pytest -n auto --dist=loadfile
