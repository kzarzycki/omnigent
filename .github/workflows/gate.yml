name: Gate

# Fork only. The one proof per change: `mise run check-fast` (the hooks, the skills' tests and the tests
# the change touches) on Mergify's draft PR, the tree it merges. `.mergify.yml` merges only once this
# `gate` check is green there; a PR's own head runs nothing, so a change is tested once. The full suite
# is nightly (fork-nightly.yml). A PR's next gate run after a red one reruns through the pack's
# `approvals.py rerun-tests`: the failed tests plus what the fix reaches, else the red run's whole selection,
# where a pass is a flake.
# The selection runs as parallel shard jobs (a hash partition of the tests by node id, one record each), so a
# whole-suite run takes about an eighth of the time and memory per runner; `gate` passes only if every shard did.

on:
  pull_request:
    branches: [mine]
    # `closed` joins the PR's concurrency group, so a closed draft's run is cancelled, not left running.
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (shard ${{ matrix.shard }})
    # Open Mergify draft PRs only (head `mergify/merge-queue/<id>`); undo: drop this line.
    if: startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 120 # timeouts.run
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    permissions:
      contents: read
      actions: read  # find and download the red run's failed tests
      issues: write  # comment on or open the `Flaky:` issues
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install test system dependencies
        # ripgrep: the Grep tool prefers it. bubblewrap: the linux_bwrap sandbox needs it.
        # tmux: harness terminal tests spawn it. apparmor sysctl: Ubuntu 24.04 blocks the
        # user namespaces bwrap needs (ephemeral runner).
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap tmux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install mise
        env:
          MISE_VERSION: v2026.11.10
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # check:setup builds the venv; its tools (pre-commit) run bare in the tasks.
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # The PR's newest red gate run (this run's earlier attempts included): its head and failed tests are the
      # inputs of `rerun-tests`. Finding none, or any failure here, leaves the output empty: the full selection runs.
      - name: Find the PR's last red gate run
        id: earlier
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
          SHARD: ${{ matrix.shard }}
          RED: ${{ runner.temp }}/red-run
        run: |
          # ponytail: the PR number comes from Mergify's draft title ("merge queue: checking #<n> on ...");
          # another title finds nothing and the full selection runs.
          pr=$(printf '%s\n' "$TITLE" | sed -n 's/.*checking #\([0-9][0-9]*\).*/\1/p' | head -1)
          if [ -z "$pr" ]; then echo "No PR number in the title '$TITLE': the full selection runs."; exit 0; fi
          run= sha=
          read -r run sha < <(gh run list --workflow gate.yml --status failure --limit 100 --json databaseId,displayTitle,headSha \
            --jq ".[] | select(.displayTitle | test(\"checking #$pr([^0-9]|\$)\")) | [.databaseId, .headSha] | @tsv" < /dev/null | head -1) || true
          if [ -z "$run" ]; then echo "No red gate run for #$pr: the full selection runs."; exit 0; fi
          gh run download "$run" --pattern "failed-tests-shard-$SHARD-attempt-*" --dir "$RED" < /dev/null
          failed=$(find "$RED" -name failed-tests.json | sort -V | tail -1)
          if [ -z "$failed" ]; then echo "Red run $run left no failed tests: the full selection runs."; exit 0; fi
          git fetch --no-tags origin "$sha" < /dev/null || { echo "Can't fetch the red head $sha: the full selection runs."; exit 0; }
          url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run"
          echo "Rerunning after $url (head $sha)." >> "$GITHUB_STEP_SUMMARY"
          { echo "failed=$failed"; echo "run=$url"; echo "sha=$sha"; echo "pr=$pr"; } >> "$GITHUB_OUTPUT"

      # Peak memory of this shard's runner, for the job summary.
      - name: Sample memory
        run: |
          echo "SHARD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          setsid nohup bash -c 'while :; do awk "/^MemTotal/{t=\$2} /^MemAvailable/{a=\$2} END{print int((t-a)/1024)}" /proc/meminfo; sleep 5; done' > "$RUNNER_TEMP/memory-used-mb" 2>&1 < /dev/null &

      # check-fast (mise.toml): check:all, then pytest on the tests the change touches. Shard 0 alone runs
      # check:all; the others install the same environment and run only their slice of the tests.
      - name: Run the checks
        env:
          # The matrix's own size, so a shard dropped from the list is never silently skipped.
          AFFECTED_TESTS_SHARDS: ${{ strategy.job-total }}
          AFFECTED_TESTS_SHARD: ${{ matrix.shard }}
          # run-affected-tests.sh writes this run's failed tests here, for the next run's rerun.
          AFFECTED_TESTS_RECORD: ${{ runner.temp }}/gate-record
          MISE_YES: "1"
          DRAFT_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DRAFT_TITLE: ${{ github.event.pull_request.title }}
          OMNIGENT_SKIP_WEB_UI: "true"
          # One eighth of the full suite (~200 min unsharded) is ~25 min on the 4-core runner; stays under the 120-min job timeout.
          AFFECTED_TESTS_WALL_SECONDS: "6000"
          # The queue takes the floor for a build input; the nightly runs the full suite after the merge.
          AFFECTED_TESTS_BUILD_INPUTS: floor
          # fork-sync/test.sh asks `gh` for the repo; the runner's gh has no login.
          GH_TOKEN: ${{ github.token }}
          EARLIER_FAILED: ${{ steps.earlier.outputs.failed }}
          EARLIER_SHA: ${{ steps.earlier.outputs.sha }}
          # The skills' tests commit in scratch repos and need an identity.
          GIT_AUTHOR_NAME: gate
          GIT_AUTHOR_EMAIL: gate@example.invalid
          GIT_COMMITTER_NAME: gate
          GIT_COMMITTER_EMAIL: gate@example.invalid
        # A draft stacks one "Merge of PR <n>" per PR of its batch (the numbers before " on " in its title)
        # on the PRs queued ahead. Diff from below the batch, so it selects every batch PR's tests and none
        # of the PRs ahead, which run theirs on their own drafts. Anything else diffs from `mine`.
        run: |
          batch=$(printf '%s\n' "${DRAFT_TITLE%% on *}" | grep -oE '#[0-9]+' | tr -d '#' || true)
          GATE_BASE=$DRAFT_HEAD
          while pr=$(git log -1 --format=%s "$GATE_BASE" | sed -nE 's/^Merge of PR ([0-9]+)$/\1/p') && [ -n "$pr" ] && grep -qx "$pr" <<<"$batch"; do
            GATE_BASE=$(git rev-parse "$GATE_BASE^1")
          done
          if [ "$GATE_BASE" = "$DRAFT_HEAD" ]; then GATE_BASE=$BASE_SHA; fi
          echo "GATE_BASE=$GATE_BASE"
          set -o pipefail
          # After a red run, the pack's rerun (its output kept for the flake step); else the full selection.
          if [ -n "$EARLIER_FAILED" ]; then
            mise run check:setup
            GATE_BASE=$GATE_BASE uv run .agents/plugins/gatekeeper/skills/gatekeeper/scripts/approvals.py \
              rerun-tests "$EARLIER_FAILED" --red "$EARLIER_SHA" --base "$GATE_BASE" 2>&1 | tee "$RUNNER_TEMP/rerun-tests.log"
          elif [ "$AFFECTED_TESTS_SHARD" = 0 ]; then
            GATE_BASE=$GATE_BASE mise run check-fast
          else
            mise run check:setup
            GATE_BASE=$GATE_BASE bash .claude/skills/cloud-dev/run-affected-tests.sh
          fi

      # A flake: a failed test `rerun-tests` named a candidate that passed on the rerun. Each one gets a comment
      # on its open `Flaky: <node id>` issue, or a new issue; one whose call fails is recorded as failed, so the
      # next run reruns it. Before the upload, which carries that record.
      - name: Record flakes on their Flaky issues
        if: always() && steps.earlier.outputs.run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EARLIER_RUN: ${{ steps.earlier.outputs.run }}
          EARLIER_SHA: ${{ steps.earlier.outputs.sha }}
          PR: ${{ steps.earlier.outputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          THIS_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          bash .claude/skills/cloud-dev/record-flakes.sh "$RUNNER_TEMP/rerun-tests.log" "$RUNNER_TEMP/gate-record"

      - name: Report this shard's wall time and peak memory
        if: always()
        run: |
          peak=$(sort -n "$RUNNER_TEMP/memory-used-mb" | tail -1)
          echo "shard ${{ matrix.shard }}: tests step wall $(( $(date +%s) - SHARD_STARTED )) s, peak memory used ${peak:-?} MB of $(awk '/^MemTotal/{print int($2/1024)}' /proc/meminfo) MB" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload this run's failed tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: failed-tests-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-record/
          retention-days: 7
          if-no-files-found: ignore

  # The one check the ruleset and Mergify require: green only if every shard passed. `always()` keeps it
  # running when a shard failed or was cancelled (a skipped required check would count as passed); the
  # `if` skips it, like the shards, outside Mergify drafts.
  gate:
    needs: tests
    if: always() && startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS_RESULT: ${{ needs.tests.result }}
        run: |
          echo "tests shards: $SHARDS_RESULT"
          [ "$SHARDS_RESULT" = success ]
