name: Fork nightly

# Fork only. Runs the full unit suite on the commit the run starts from (mine on a
# schedule; dispatch it with --ref mine); a red run opens (or updates) a
# "Nightly red since <sha>" issue through the engineering pack's nightly.py
# (vendored in .claude/skills/cloud-dev/nightly/, see SYNC.md there).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra all --group test

      - name: Run the full suite
        env:
          OMNIGENT_SKIP_WEB_UI: "true"
        run: uv run --no-sync pytest -n auto --dist=loadfile --timeout=90

      - name: Open or update the red issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          red=$(git rev-parse HEAD)
          # newest earlier green nightly's commit; none yet -> the oldest of the last 20 merges
          green=$(gh run list --workflow fork-nightly.yml --branch mine --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$green" ] || ! git merge-base --is-ancestor "$green" "$red"; then
            green=$(git rev-list --first-parent -n 20 "$red" | tail -1)
          fi
          python3 .claude/skills/cloud-dev/nightly/nightly.py red --last-green "$green" --red "$red" \
            --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
