name: Fork nightly

# Fork only. Runs the full unit suite on the commit the run starts from (mine on a
# schedule; dispatch it with --ref mine); a red run opens (or updates) a
# "Nightly red since <sha>" issue through the engineering pack's nightly.py
# (vendored in .claude/skills/cloud-dev/nightly/, see SYNC.md there).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra all --group test

      - name: Run the full suite
        env:
          OMNIGENT_SKIP_WEB_UI: "true"
        # The sampler writes into this step's own log, which GitHub streams live,
        # so its lines survive a runner that dies mid-step.
        run: |
          (
            prev=0
            while true; do
              mem=$(free -m | awk '/^Mem:/{printf "used=%s avail=%s ", $3, $7} /^Swap:/{printf "swap=%s", $3}')
              top=$(ps -eo rss=,comm= | awk '{m[$2]+=$1; n[$2]++} END {for (c in m) printf "%d %s*%d\n", m[c]/1024, c, n[c]}' | sort -rn | head -5 | paste -sd, -)
              oom=$(sudo dmesg | grep -ciE "oom-kill|killed process" || true)
              echo; echo "MEM $(date -u +%T) procs=$(ps -e --no-headers | wc -l) $mem oom=$oom top=[$top]"
              if [ "$oom" -gt "$prev" ]; then sudo dmesg -T | grep -iE "oom-kill|killed process" | tail -n $((oom - prev)) | sed 's/^/OOM /'; prev=$oom; fi
              sleep 60
            done
          ) &
          sampler=$!
          rc=0
          timeout --kill-after=60 12600 uv run --no-sync pytest -n auto --dist=loadfile --timeout=90 || rc=$?
          kill "$sampler"
          exit "$rc"

      - name: Report memory and OOM kills
        if: ${{ always() }}
        run: |
          sudo dmesg -T | grep -iE "out of memory|oom-kill|killed process" || echo "no OOM lines in dmesg"
