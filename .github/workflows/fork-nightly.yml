name: Fork nightly

# Fork only. Runs the full unit suite on the commit the run starts from (mine on a
# schedule; dispatch it with --ref mine); a red run opens (or updates) a
# "Nightly red since <sha>" issue through the engineering pack's nightly.py
# (vendored in .claude/skills/cloud-dev/nightly/, see SYNC.md there).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra all --group test

      - name: Start the memory sampler
        run: |
          cat > "$RUNNER_TEMP/sample.sh" <<'SH'
          while true; do
            echo "=== $(date -u +%FT%TZ) procs=$(ps -e --no-headers | wc -l)"
            free -m | sed -n 2,3p
            echo "-- RSS MB by command"
            ps -eo rss=,comm= | awk '{m[$2]+=$1; n[$2]++} END {for (c in m) printf "%8.0f %4d %s\n", m[c]/1024, n[c], c}' | sort -rn | head -12
            echo "-- top processes"
            ps -eo pid=,ppid=,rss=,etimes=,args= --sort=-rss | head -12 | cut -c1-200
            sleep 30
          done
          SH
          nohup bash "$RUNNER_TEMP/sample.sh" > "$RUNNER_TEMP/mem.log" 2>&1 &

      - name: Run the full suite
        env:
          OMNIGENT_SKIP_WEB_UI: "true"
        run: timeout --kill-after=60 12600 uv run --no-sync pytest -n auto --dist=loadfile --timeout=90

      - name: Report memory and OOM kills
        if: ${{ always() }}
        run: |
          sudo dmesg -T | grep -iE "out of memory|oom-kill|killed process" || echo "no OOM lines in dmesg"
          grep -E "^===|^Mem:|^Swap:" "$RUNNER_TEMP/mem.log" | paste - - - | awk 'NR % 10 == 1'
          cp "$RUNNER_TEMP/mem.log" mem.log

      - name: Upload the memory samples
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mem-samples
          path: mem.log
