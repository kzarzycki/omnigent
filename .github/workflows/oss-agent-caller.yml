# Runs a free-model coding agent on one task and opens a draft PR with its change.
# Started by hand: gh workflow run oss-agent-caller.yml -f task='<what to do>'
# The reusable workflow is pinned to a commit; bump it on purpose.
name: OSS agent caller

on:
  workflow_dispatch:
    inputs:
      task:
        description: What the agent should do
        required: true
        type: string

permissions: {}

jobs:
  agent:
    permissions:
      contents: write
      pull-requests: write
    uses: kzarzycki/agent-skills/.github/workflows/oss-agent.yml@1cf901e14722ae6a9ae7a7bfbe767f16cd424ec2
    with:
      task: ${{ inputs.task }}
      ref: mine
      # The repo's own check, as gate.yml's lint job runs it: the pre-commit hooks, on the files
      # the agent's commit(s) change against mine. A bare `ruff check .` also lints the
      # pre-commit-excluded vendored trees. The base is the commit the checkout started from, the
      # oldest entry in the reflog of origin/mine (the checkout writes it, and a later fetch only
      # adds newer ones). No fetch, so a PR landing on mine meanwhile cannot move it.
      test_command: |
        set -e
        BASE="$(git reflog show --format=%H refs/remotes/origin/mine | tail -n 1)"
        BASE="${BASE:-$(git rev-parse origin/mine)}"
        OMNIGENT_SKIP_WEB_UI=true uv sync --locked --extra all --group test --group lint
        corepack enable
        pnpm install --frozen-lockfile --filter web --filter omnigent-vscode
        uv run --no-sync pre-commit run --from-ref "$BASE" --to-ref HEAD
    secrets:
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
