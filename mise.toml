# Fork-only, tasks only: the engineering loop's gate (docs/agents/loop.md, `loop.ci: false`).
[tasks."check:setup"]
description = "Install what the hooks need (the Python env and the web packages, which custom-lint's TypeScript check needs for any change) so check:all runs in a fresh worktree. Quick when installed."
run = """
set -e
OMNIGENT_SKIP_WEB_UI=true uv sync --locked --extra all --group test --group lint
# custom-lint (any .py/.sh/.ts change) and the web hooks need these; pnpm install is a no-op once present.
if ! { [ -d web/node_modules ] && [ -d editors/vscode/node_modules ]; }; then
  pnpm install --frozen-lockfile --filter web --filter omnigent-vscode
fi
"""

[tasks."check:all"]
alias = "check"
depends = ["check:setup"]
description = "pre-commit on the files the branch changes since mine, then the fork-sync and cloud-dev skills' tests and the claude-cloud bridge's self-check."
run = [
  'pre-commit run --from-ref "$(git merge-base origin/mine HEAD)" --to-ref HEAD',
  "bash .claude/skills/fork-sync/test.sh",
  "bash .claude/skills/cloud-dev/test.sh",
  "python3 integrations/claude-cloud-acp/claude_cloud_acp.py --self-check",
]
